name: Estado de migración de Zavalla

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio independiente
        uses: actions/checkout@v4

      - name: Verificar separación de repositorios
        shell: bash
        run: |
          set -euo pipefail

          required=(
            app.py
            app_zavalla.py
            sitios_lolium.py
            config_zavalla.py
            predweem_core.py
            update_meteo.py
            update_meteo_core.py
            meteo_daily.csv
            IW.npy
            bias_IW.npy
            LW.npy
            bias_out.npy
          )

          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Archivo faltante o vacío: $path" >&2
              exit 1
            fi
          done

          python - <<'PY'
          from sitios_lolium import DEFAULT_SITE_SLUG, SITES, get_site

          assert DEFAULT_SITE_SLUG == "zavalla"
          assert set(SITES) == {"zavalla"}
          assert get_site().repositorio == "PREDWEEM/LOLIUM_ZAVALLA2026"
          print("Repositorio independiente de Zavalla verificado.")
          print("Integrador regional: PREDWEEM/MULTISITIO")
          PY
