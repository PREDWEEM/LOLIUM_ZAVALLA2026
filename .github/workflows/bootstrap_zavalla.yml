name: Inicializar repositorio independiente de Zavalla

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap_zavalla.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-zavalla
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar aplicación validada
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/PREDWEEM/LOLIUMZAVALLA.git /tmp/origen
          rsync -a --exclude='.git' --exclude='.github' /tmp/origen/ ./

          mkdir -p data/meteo_sitios tests .github/workflows
          find data/meteo_sitios -maxdepth 1 -type f ! -name 'zavalla.csv' -delete || true
          rm -rf data/inspecciones data/selector tests
          mkdir -p tests
          [[ -s data/meteo_sitios/zavalla.csv ]] || cp meteo_daily.csv data/meteo_sitios/zavalla.csv

      - name: Limitar el registro a Zavalla
        shell: bash
        run: |
          cat > sitios_lolium.py <<'PY'
          from __future__ import annotations

          from dataclasses import asdict, dataclass
          from pathlib import Path


          @dataclass(frozen=True)
          class LoliumSite:
              slug: str
              nombre: str
              provincia: str
              latitud: float
              longitud: float
              repositorio: str
              timezone: str = "America/Argentina/Cordoba"
              usa_siga_historico: bool = False
              rama_meteo: str = "main"
              archivo_meteo: str = "meteo_daily.csv"
              modelo_operativo: str = "con_lag"
              lag_operativo_dias: int = 15

              @property
              def etiqueta(self) -> str:
                  return f"{self.nombre} ({self.provincia})"

              @property
              def repository_url(self) -> str:
                  return f"https://github.com/{self.repositorio}"

              @property
              def raw_meteo_url(self) -> str:
                  return (
                      f"https://raw.githubusercontent.com/{self.repositorio}/"
                      f"{self.rama_meteo}/{self.archivo_meteo}"
                  )

              @property
              def modelo_operativo_etiqueta(self) -> str:
                  return f"Con lag fijo de {self.lag_operativo_dias} días"

              def meteo_path(self, base: str | Path = ".") -> Path:
                  return Path(base) / "data" / "meteo_sitios" / "zavalla.csv"

              def inspections_path(self, base: str | Path = ".") -> Path:
                  return Path(base) / "data" / "inspecciones" / "zavalla.csv"

              def selector_state_path(self, base: str | Path = ".") -> Path:
                  return Path(base) / "data" / "selector" / "zavalla.json"

              def to_dict(self) -> dict:
                  return asdict(self)


          ZAVALLA = LoliumSite(
              slug="zavalla",
              nombre="Zavalla",
              provincia="Santa Fe",
              latitud=-33.02157,
              longitud=-60.87930,
              repositorio="PREDWEEM/LOLIUM_ZAVALLA2026",
              timezone="America/Argentina/Cordoba",
              modelo_operativo="con_lag",
              lag_operativo_dias=15,
          )

          SITES = {"zavalla": ZAVALLA}
          DEFAULT_SITE_SLUG = "zavalla"


          def get_site(slug: str = DEFAULT_SITE_SLUG) -> LoliumSite:
              normalized = str(slug or DEFAULT_SITE_SLUG).strip().lower()
              if normalized != DEFAULT_SITE_SLUG:
                  raise KeyError(f"Este repositorio solo admite Zavalla: {slug}")
              return ZAVALLA


          def ordered_sites() -> list[LoliumSite]:
              return [ZAVALLA]
          PY

      - name: Adaptar interfaz y estado meteorológico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path("app_multisitio_principal.py")
          text = ui.read_text(encoding="utf-8")
          text = text.replace("PREDWEEM LOLIUM Multisitio", "PREDWEEM LOLIUM Zavalla")
          text = text.replace("🌾 PREDWEEM LOLIUM — Plataforma multisitio", "🌾 PREDWEEM LOLIUM — Zavalla 2026")
          text = text.replace(
              "Predicción operativa de emergencia de Lolium con selección automática del modelo según la localidad.",
              "Predicción operativa de emergencia de Lolium para Zavalla, Santa Fe.",
          )
          text = text.replace(
              "Política automática: Pergamino y Zavalla usan solamente el modelo con lag fijo; las demás localidades usan solamente el modelo sin lag.",
              "Modelo local de Zavalla: lag fijo de 15 días y calibración específica.",
          )
          ui.write_text(text, encoding="utf-8")

          core = Path("update_meteo_core.py")
          text = core.read_text(encoding="utf-8")
          text = text.replace(
              '"modo": "HIBRIDO_ZAVALLA_Y_COPIA_EXACTA_MULTISITIO"',
              '"modo": "HIBRIDO_ZAVALLA_INDEPENDIENTE"',
          )
          text = text.replace(
              " Los demás sitios conservan copia exacta de sus repositorios.",
              "",
          )
          core.write_text(text, encoding="utf-8")
          PY

      - name: Crear prueba local
        shell: bash
        run: |
          cat > tests/test_zavalla_local.py <<'PY'
          import math

          import update_meteo as meteo
          from sitios_lolium import DEFAULT_SITE_SLUG, SITES, get_site, ordered_sites


          def test_repositorio_contiene_un_solo_sitio():
              assert DEFAULT_SITE_SLUG == "zavalla"
              assert list(SITES) == ["zavalla"]
              assert ordered_sites() == [get_site()]
              assert get_site().repositorio == "PREDWEEM/LOLIUM_ZAVALLA2026"
              assert get_site().lag_operativo_dias == 15


          def test_precipitacion_negativa_se_descarta():
              assert math.isnan(meteo._safe_precipitation_mm(-1.0, "mm"))
          PY

      - name: Crear actualización automática exclusiva
        shell: bash
        run: |
          cat > .github/workflows/update_meteo.yml <<'YAML'
          name: Actualizar meteorología de Zavalla

          on:
            workflow_dispatch:
            schedule:
              - cron: "30 10 * * *"

          permissions:
            contents: write

          concurrency:
            group: meteorologia-zavalla
            cancel-in-progress: false

          jobs:
            actualizar:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Instalar dependencias
                  run: python -m pip install --disable-pip-version-check pandas requests pytest
                - name: Probar configuración local
                  run: |
                    python -m py_compile update_meteo.py update_meteo_core.py sitios_lolium.py
                    python -m pytest tests/test_zavalla_local.py -q
                - name: Actualizar serie híbrida
                  run: python update_meteo.py
                - name: Validar y publicar
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    import pandas as pd

                    root = Path("meteo_daily.csv")
                    local = Path("data/meteo_sitios/zavalla.csv")
                    state_path = Path("data/estado_actualizacion_meteo.json")
                    if root.read_bytes() != local.read_bytes():
                        raise SystemExit("meteo_daily.csv no coincide con Zavalla")
                    data = pd.read_csv(root)
                    data["Fecha"] = pd.to_datetime(data["Fecha"], errors="coerce")
                    for column in ("TMAX", "TMIN", "Prec"):
                        data[column] = pd.to_numeric(data[column], errors="coerce")
                    if data[["Fecha", "TMAX", "TMIN", "Prec"]].isna().any().any():
                        raise SystemExit("La serie contiene valores críticos nulos")
                    if (data["TMAX"] < data["TMIN"]).any() or (data["Prec"] < 0).any():
                        raise SystemExit("La serie contiene valores físicamente inválidos")
                    expected = pd.date_range(data["Fecha"].min(), data["Fecha"].max(), freq="D")
                    if len(expected.difference(pd.DatetimeIndex(data["Fecha"]))):
                        raise SystemExit("La serie no es diaria y continua")
                    state = json.loads(state_path.read_text(encoding="utf-8"))
                    if state.get("modo") != "HIBRIDO_ZAVALLA_INDEPENDIENTE":
                        raise SystemExit(f"Modo inesperado: {state.get('modo')}")
                    if set(state.get("sitios", {})) != {"zavalla"}:
                        raise SystemExit("El estado contiene otros sitios")
                    PY
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add meteo_daily.csv data/meteo_sitios/zavalla.csv data/estado_actualizacion_meteo.json
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "Actualiza meteorología híbrida de Zavalla"
                    git pull --rebase origin main
                    git push origin main
          YAML

      - name: Documentar y probar repositorio
        shell: bash
        run: |
          cat > README.md <<'MD'
          # PREDWEEM LOLIUM — Zavalla 2026

          Repositorio independiente del modelo operativo PREDWEEM para **Zavalla, Santa Fe**.

          - Coordenadas: `-33.02157, -60.87930`.
          - Modelo operativo: lag fijo de 15 días.
          - Cobertura de rastrojo ajustable.
          - Umbral operativo: `EMERREL >= 0.0001`.
          - Ventana fenológica: 600–800 °Cd.
          - Meteorología: SMN Rosario Aero → NOAA → ECMWF Archive → ECMWF Forecast.
          - Actualización automática diaria: 07:30 de Argentina.

          ```bash
          python -m pip install -r requirements.txt
          python update_meteo.py
          streamlit run app.py
          ```

          La versión multisitio previa se conserva en la rama `multisitio-legacy-20260802`
          de `PREDWEEM/LOLIUMZAVALLA`.

          **PREDWEEM by Guillermo R. Chantre**
          MD

          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m py_compile app.py app_fuente_hibrida.py app_detalle_1pct.py app_umbral_operativo.py app_zoom_operativo.py app_multisitio.py app_multisitio_principal.py mapa_sitios.py config_zavalla.py sitios_lolium.py predweem_core.py visualizacion_pulsos.py visualizacion_operativa.py update_meteo.py update_meteo_core.py
          python -m pytest tests/test_zavalla_local.py -q
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          for name in ("IW.npy", "bias_IW.npy", "LW.npy", "bias_out.npy"):
              path = Path(name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Activo ANN faltante: {name}")
              np.load(path)
          PY

      - name: Desactivar bootstrap automático y publicar
        shell: bash
        run: |
          cat > .github/workflows/bootstrap_zavalla.yml <<'YAML'
          name: Migración de Zavalla completada
          on:
            workflow_dispatch:
          jobs:
            estado:
              runs-on: ubuntu-latest
              steps:
                - run: echo "El repositorio independiente ya fue inicializado."
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separa modelo operativo independiente de Zavalla"
          git push origin main
